<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Engineering — SK Studios</title>
<meta name="description" content="Engineering portfolio of Shanthanu Kelso. Project documentation is in preparation.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:ital,wght@0,600;0,700;1,700&family=Nunito+Sans:opsz,wght@6..12,300;6..12,400;6..12,600&display=swap" rel="stylesheet">
<style>
    :root { --orange:#D64A32; --cream:#E7D1C3; --teal:#617F8A; --bg:#060604; --surface:#0d0d0b; --surface2:#131311; --text:#F0EDE6; --muted:#9a9690; --border:#1a1a17; --border2:#272724; --display:'Rockwell','Rockwell Nova','Zilla Slab',Georgia,serif; --body:'Avenir Next','Avenir','Century Gothic','Nunito Sans',sans-serif; }
    *,*::before,*::after { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; background:var(--bg); color:var(--text); font:300 16px/1.7 var(--body); }
    a { color:inherit; }
    a:focus-visible { outline:2px solid var(--orange); outline-offset:6px; }
    .skip { position:absolute; left:1rem; top:-100px; z-index:10; background:var(--bg); padding:1rem; }
    .skip:focus { top:1rem; }
    .shell { max-width:1440px; margin:auto; padding-inline:clamp(1.5rem,5vw,5rem); }
    .nav { min-height:88px; display:flex; justify-content:space-between; align-items:center; gap:1rem; border-bottom:1px solid var(--border); }
    .brand { display:inline-flex; align-items:center; }
    .logo { display:block; width:auto; height:44px; filter:brightness(0) invert(1); opacity:.82; }
    .nav-links { display:flex; gap:clamp(1rem,3vw,2.5rem); list-style:none; padding:0; margin:0; flex-wrap:wrap; }
    .nav-links a,.eyebrow,.panel-meta,.panel-link { font-size:.875rem; font-weight:600; letter-spacing:.14em; text-transform:uppercase; }
    .nav-links a { text-decoration:none; color:var(--muted); transition:color .2s; }
    .nav-links a:hover { color:var(--text); }
    .intro { padding-block:clamp(3rem,6vw,6rem) 2.8rem; position:relative; }
    .intro::before { content:''; position:absolute; inset:0; pointer-events:none; background:repeating-linear-gradient(-18deg,transparent 0 55px,rgba(214,74,50,.06) 55px 85px,transparent 85px 140px); mask-image:linear-gradient(100deg,transparent 35%,#000); }
    .intro > * { position:relative; }
    .eyebrow { color:var(--orange); margin:0 0 1.25rem; }
    h1 { font:700 clamp(3.75rem,8vw,7.5rem)/.98 var(--display); letter-spacing:-.035em; margin:0 0 1.5rem; }
    h1 em { font-style:italic; color:var(--orange); }
    .intro-copy { color:var(--muted); max-width:48ch; font-size:1.125rem; margin:0; }
    .portfolios { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:1.5rem; padding-bottom:5rem; }
    .portfolio { position:relative; overflow:hidden; display:flex; flex-direction:column; min-height:355px; padding:clamp(1.5rem,3vw,2.5rem); border:1px solid var(--border2); background:var(--surface); text-decoration:none; transition:border-color .3s,background .3s; isolation:isolate; }
    .portfolio::after { content:''; position:absolute; bottom:0; left:0; width:44px; height:2px; background:var(--orange); transition:width .4s cubic-bezier(.2,.7,.2,1); }
    .portfolio:hover,.portfolio:focus-visible { border-color:var(--muted); background:var(--surface2); }
    .portfolio:hover::after,.portfolio:focus-visible::after { width:100%; }
    .panel-meta { display:flex; justify-content:space-between; flex-wrap:wrap; gap:.5rem 1rem; color:var(--muted); font-size:.75rem; letter-spacing:.16em; margin:0 0 6rem; }
    .panel-number { color:var(--orange); }
    .portfolio h2 { font:700 clamp(2rem,3.5vw,3.5rem)/1.08 var(--display); margin:0 0 .85rem; }
    .panel-copy { color:var(--muted); margin:0 0 2rem; max-width:34ch; }
    .panel-link { margin-top:auto; display:flex; justify-content:space-between; align-items:center; gap:1rem; font-size:.75rem; }
    .panel-link span:last-child { font-size:1.5rem; font-weight:300; line-height:1; }
    .icon-band { position:absolute; top:4rem; left:0; right:0; height:78px; pointer-events:none; color:#aaa; }
    .roll-icon { position:absolute; width:66px; height:66px; opacity:0; transition:transform .65s cubic-bezier(.2,.7,.2,1),opacity .4s; }
    .from-left { left:1.8rem; transform:translateX(-115px) rotate(-135deg); }
    .from-right { right:2rem; width:52px; height:52px; top:12px; transform:translateX(115px) rotate(110deg); transition-delay:.06s; }
    .portfolio:hover .roll-icon,.portfolio:focus-visible .roll-icon { opacity:.38; transform:translateX(0) rotate(0); }
    .contact { border-top:1px solid var(--border2); padding-block:3.5rem 4rem; display:flex; align-items:baseline; justify-content:space-between; gap:2rem; flex-wrap:wrap; scroll-margin-top:2rem; }
    .contact h2 { font:700 clamp(2rem,4vw,3rem)/1.1 var(--display); margin:0 0 .75rem; }
    .contact h2 em { color:var(--orange); }
    .contact p { color:var(--muted); margin:0; }
    .contact-email { text-underline-offset:.5em; text-decoration-color:var(--orange); overflow-wrap:anywhere; transition:color .2s; }
    .contact-email:hover { color:var(--orange); }
    footer { padding-block:2rem; border-top:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; gap:1.5rem; color:var(--muted); font-size:.875rem; }
    footer .logo { height:36px; opacity:.55; }
    footer p { margin:0; }
    .engineering-main { min-height:65vh; padding-block:5rem; }
    .engineering-main h1 { font-size:clamp(3rem,8vw,6.5rem); overflow-wrap:anywhere; }
    .engineering-main .intro-copy { margin-bottom:2.5rem; }
    .back-link { text-underline-offset:.5em; text-decoration-color:var(--orange); }
    @media (hover:none) { .roll-icon { opacity:.2; transform:none; } }
    @media (max-width:700px) { .portfolios { grid-template-columns:1fr; gap:1rem; padding-bottom:3rem; } .portfolio { min-height:330px; } .intro { padding-top:3rem; } .nav { min-height:80px; } .nav-links a { font-size:.75rem; letter-spacing:.1em; } footer { align-items:flex-start; } }
    @media (prefers-reduced-motion:reduce) { html { scroll-behavior:auto; } *,*::before,*::after { transition:none!important; animation:none!important; } .roll-icon { opacity:.2; transform:none; } }
</style>
